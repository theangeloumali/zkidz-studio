# Created by The Angelo Umali.
[project]
name = "zks-engine"
version = "0.1.0"
description = "ZKidz Studio render engine: EDL, audio, captions, GPU masters and the HyperFrames overlay bridge."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jsonschema==4.25.1",
    "numpy>=2.1,<3",
    "psutil>=7,<8",
]

[project.scripts]
zks-engine = "zks_engine.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
