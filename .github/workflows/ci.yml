# Created by The Angelo Umali.
# Lint, typecheck and tests on every push and pull request. Actions are pinned by commit SHA; bump the SHA and the tag comment together.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  HYPERFRAMES_NO_TELEMETRY: "1"

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm verify

  engine:
    name: engine unittest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # The overlay renderer tests fail instead of skipping when node, its packages, ffmpeg or Chrome is missing.
      ZKS_REQUIRE_HF: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pinned ffmpeg, not the runner's apt build: golden frames differ between ffmpeg releases.
      - run: pnpm zks setup
      - run: ffmpeg="$(node scripts/pinned-ffmpeg.mjs)" && echo "ZKS_FFMPEG=$ffmpeg" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --project packages/engine --locked
      - run: uv run --project packages/engine python -m unittest discover -s packages/engine/tests

  setup:
    name: setup.sh + doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No setup-node or pnpm action: this job proves the checksummed bootstrap on a bare runner.
      - name: Run setup.sh into a throwaway ZKS_HOME
        run: ./setup.sh --no-start
        env:
          ZKS_HOME: ${{ runner.temp }}/zks
      - name: Doctor
        run: |
          # setup.sh's PATH change dies with its shell; pick up the bootstrap pnpm if it installed one.
          for dir in "$ZKS_HOME"/tools/pnpm/*/; do [ -x "$dir/pnpm" ] && export PATH="$dir:$PATH"; done
          pnpm zks doctor --json
        env:
          ZKS_HOME: ${{ runner.temp }}/zks
