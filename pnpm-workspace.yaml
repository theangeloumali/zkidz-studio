# Created by The Angelo Umali.
packages:
  - apps/*
  - packages/*
  # The overlay renderer lives inside the uv engine package; listing it keeps its deps under the workspace's release-age and build policy.
  - packages/engine/hf
  - scripts

# Reviewed build scripts only (strictDepBuilds fails the install on any other).
strictDepBuilds: true
allowBuilds:
  node-pty: true
  # drizzle-kit loads TS through esbuild; its postinstall only re-checks the binary the platform package already ships.
  esbuild: false

# Minutes. A week-old floor keeps a freshly hijacked release out of the lockfile.
minimumReleaseAge: 10080
# Plan §6.6 pins the Agent SDK at 0.3.308, newer than the floor; exact versions only.
minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.308"

# vitest reused a fork whose start had failed and crashed on its SIGTERM; its fixed 60 s start limit also undercut jsdom's
# measured 61 s cold load under ci:local. tests/vitest-worker-reuse.test.ts in apps/web guards the reuse fix.
patchedDependencies:
  vitest@5.0.5: patches/vitest@5.0.5.patch
