# Created by The Angelo Umali.
# Local Supabase Postgres for DATABASE_URL (plan §8). `up` without a profile starts Postgres only; Studio is the "studio" profile.
# Every publishing carries 127.0.0.1: Docker otherwise publishes on every host address, and `supabase start` did (spike 03).
# Run through packages/db/scripts/supabase.ts, which generates the passwords into ZKS_HOME/db/supabase.env (0600).
# Images: tag for reading, digest for pulling; bump both together. Studio and meta versions follow Supabase's self-hosting compose.
name: zks-studio-supabase

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.004@sha256:b15d862126dd2dac02da524696ccfde2dcce2ceaee0a58973b2727befe492706
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by the supabase start script}
    ports:
      - "127.0.0.1:45322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 24

  meta:
    profiles: ["studio"]
    image: public.ecr.aws/supabase/postgres-meta:v0.100.0@sha256:145325b7e39f8ef4931d6e8cfd3f6f4d655de09d72a2ccc96d9513542c2202bd
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?generated by the supabase start script}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?generated by the supabase start script}

  # No login of its own (Kong guards it upstream), so it publishes nothing; studio-proxy is the only way in.
  studio:
    profiles: ["studio"]
    image: public.ecr.aws/supabase/studio:2026.10.12-sha-3699278@sha256:948770ec467f00e6ae34c35018ef7cb23d7b30eb806b42c2cc0d7bcfdcf8a7a8
    depends_on:
      - meta
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by the supabase start script}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?generated by the supabase start script}
      DEFAULT_ORGANIZATION_NAME: ZKidz Studio
      DEFAULT_PROJECT_NAME: Local database
      ENABLED_FEATURES_LOGS_ALL: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD-SHELL", 'node -e "fetch(''http://localhost:3000/api/platform/profile'').then((r) => {if (r.status !== 200) throw new Error(r.status)})"']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Basic auth in front of Studio, and a Host allow-list against DNS rebinding.
  studio-proxy:
    profiles: ["studio"]
    image: docker.io/library/caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    depends_on:
      studio:
        condition: service_healthy
    environment:
      STUDIO_USERNAME: zks
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?generated by the supabase start script}
    # Hash at boot so only the bcrypt hash stays in the Caddy process environment.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        STUDIO_PASSWORD_HASH="$$(printf '%s\n' "$$STUDIO_PASSWORD" | caddy hash-password)" &&
        export STUDIO_PASSWORD_HASH && unset STUDIO_PASSWORD &&
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    configs:
      - source: studio-proxy-caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "127.0.0.1:45323:45323"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 5s
      retries: 15

configs:
  # `route` keeps source order: Caddy would otherwise sort basic_auth ahead of the Host check.
  # `host` ignores the port, so the exact host:port is matched by expression.
  studio-proxy-caddyfile:
    content: |
      {
        auto_https off
      }
      :45323 {
        route {
          @foreign not expression {hostport} in ['127.0.0.1:45323', 'localhost:45323']
          respond @foreign "Misdirected Request" 421
          # Browsers attach cached basic-auth to cross-site requests, so only this origin (or no browser) gets past here.
          @crossSite expression {header.Sec-Fetch-Site} in ['cross-site', 'same-site'] || ({header.Origin} != '' && !({header.Origin} in ['http://127.0.0.1:45323', 'http://localhost:45323']))
          respond @crossSite "Forbidden" 403
          basic_auth {
            {env.STUDIO_USERNAME} {env.STUDIO_PASSWORD_HASH}
          }
          reverse_proxy studio:3000
        }
      }

volumes:
  db-data:
