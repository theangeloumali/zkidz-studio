<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ZKidz Studio social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500&display=swap" />
    <style>
      /* Created by The Angelo Umali. */
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 440px;
        grid-template-rows: 640px;
        background: #0c1117;
        color: #f2efe6;
        font-family: "Archivo", system-ui, sans-serif;
      }
      .copy {
        padding: 56px 0 48px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        font-stretch: 75%;
        font-weight: 800;
        font-size: 32px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .brand span {
        color: #d5b13a;
      }
      h1 {
        font-stretch: 68%;
        font-weight: 900;
        font-size: 70px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      h1 span {
        display: block;
        color: #d5b13a;
      }
      .foot {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        color: #aab3bf;
      }
      .covers {
        display: flex;
        gap: 16px;
        padding: 0 40px;
        transform: rotate(6deg) scale(1.1);
        transform-origin: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 180px;
      }
      .col:nth-child(2) {
        margin-top: -120px;
      }
      .col img {
        width: 180px;
        height: 320px;
        object-fit: cover;
        border-radius: 14px;
        border: 1px solid #2a3340;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">ZKidz <span>Studio</span></div>
      <h1>Type what you want. <span>Watch the edit happen.</span></h1>
      <div class="foot">Open source · runs on your computer</div>
    </div>
    <div class="covers" aria-hidden="true">
      <div class="col">
        <img src="showcase/01-gpt-astra-vs-claude-opus-5-5.jpg" alt="" />
        <img src="showcase/04-how-i-landed-a-client-in-one-week.jpg" alt="" />
        <img src="showcase/09-ats-friendly-resume-free-with-ai.jpg" alt="" />
      </div>
      <div class="col">
        <img src="showcase/studio-ep12-cover-A.jpg" alt="" />
        <img src="showcase/11-claude-edits-my-videos-now.jpg" alt="" />
        <img src="showcase/13-how-to-start-a-freelance-career.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
