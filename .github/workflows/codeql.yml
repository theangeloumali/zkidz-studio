# Created by The Angelo Umali.
# CodeQL code scanning (plan §11 supply chain), started by hand. Actions are pinned by commit SHA; bump the SHA and the tag comment together.
name: codeql

on:
  # Manual only: CI runs locally before every merge (pnpm ci:local); per-push runs spammed every failure by email.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploads the SARIF results to code scanning; nothing else is written.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Interpreted languages only, so no build step runs contributor code.
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
